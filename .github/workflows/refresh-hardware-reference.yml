name: Regenerate hardware entry reference (feature branch)

on:
  push:
    branches: [feature/hardware-abstraction]
    paths:
      - '.github/workflows/refresh-hardware-reference.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'anderssandstrom/ecmccfg'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-abstraction
          persist-credentials: true
      - name: Generate canonical documentation pages
        run: python3 hugo/scripts/generate_hardware_reference.py
      - name: Commit generated reference if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hugo/content/manual/knowledgebase/hardware/entries
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate hardware entry reference for feature PR'
            git push origin HEAD:feature/hardware-abstraction
          fi
