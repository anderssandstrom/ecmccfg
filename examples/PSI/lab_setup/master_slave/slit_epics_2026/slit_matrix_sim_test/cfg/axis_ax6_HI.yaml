# https://paulscherrerinstitute.github.io/ecmccfg/manual/axis/axisyaml/

axis:
  id: 6
  group: realAxes
  mode: CSV
  #parameters: 'powerAutoOnOff=2;powerOnDelay=1.0;powerOffDelay=2.0;'
  features:
    allowSrcChangeWhenEnabled: true
  autoEnable:
    disableTimeout: 2.0
    enableTimeout: 2.0

epics:
  name: TR_HI
  precision: 4
  unit: mm
  motorRecord:
    description: "Hi"
    fieldInit: "SPAM=0,DIR=Pos,OFF=0,RTRY=0,FOFF=Frozen,TWV=1"

drive:
  numerator: 10                # max velo in EGU/s
  denominator: 32768            # MAX_INT for a 16-bit register, always this for this stepper drive!
  type: 0
  enable: 0                     # Enable bit in the Beckhoff control word
  enabled: 1                    # Enabled bit in the Beckhoff status word
  reset: 1                    # EL70xx control bit 1 resets the drive fault
  error:
    - 3                       # EL70xx status bit 3 -> drive alarm 0
  control: ec${M_ID=0}.s$(DRV_SLAVE).driveControl01
  status: ec${M_ID=0}.s$(DRV_SLAVE).driveStatus01
  setpoint: ec${M_ID=0}.s$(DRV_SLAVE).velocitySetpoint01
  reduceTorque: 2                                     # Reduce torque bit in drive control word
  reduceTorqueEnable: True                            # Enable reduce torque functionality

encoder:
  desc: Openloop
  numerator: 1          # 1egu = 1mm
  denominator: 12800    # Number of ticks when motor moves numerator (=1mm): 1 mm / 50 nm = 20000
  type: 0               # Type: 0=Incremental, 1=Absolute
  bits: 16              # Total bit count of encoder raw data
  absBits: 0            # Absolute bit count (for abs enc) always least significant part of 'bits'
  absOffset: 0.0000     # Encoder offset in eng units (for absolute encoders)
  position: ec${M_ID=0}.s$(ENC_SLAVE).positionActual$(ENC_CHANNEL)

controller:
  Kp: 2.000
  Ki: 0.000
  Kd: 0.000
  Kff: 1.00

trajectory:
  axis:
    velocity: 1.0
    acceleration: 1.0
    deceleration: 1.0

input:
  limit:
    forward: ec${M_ID=0}.s$(DRV_SLAVE).driveStatus01.12   # 1111969 cnts // 55.5984 mm
    backward: ec${M_ID=0}.s$(DRV_SLAVE).driveStatus01.11  #  109007 cnts //  5.4504 mm
  home: ec${M_ID=0}.s-1.ONE.0                   # unused
  interlock: ec${M_ID=0}.s-1.ONE.0                   # unused

softlimits:
  enable: true
  backwardEnable: true
  forwardEnable: true
  forward: 1
  backward: -1

monitoring:
  lag:
    enable: true
    tolerance: 0.02
    time: 100
  target:
    enable: true
    tolerance: 0.01
    time: 100
  velocity:
    enable: true
    max: 5
    time:
      trajectory: 100
      drive: 200

plc:
  enable: true
  externalCommands: true
  velocity_filter:
    encoder:
      enable: false
      size: 1
    trajectory:
      enable: false
      size: 1
