# Macros:
#  AX_ID    : This axis id
#  AX_NAME  : This axis name
#  DRV_ID   : Slave id of drive
#  BO_ID    : Slave Id of binary output for feeding switches
#  OFFSET   : Offset

axis:
  id: ${AX_ID=1}
  #feedSwitchesOutput: ec0.s$(BO_ID).binaryOutput01.0 # EtherCAT entry for feed switches  

epics:
  name: ${AX_NAME=Axis1}
  precision: 3
  unit: mm
  motorRecord:
    enable: true
    description: ""
    fieldInit: "RTRY=0,FOFF=Frozen"

# Max scale is for motors with:
# * 6 pole: Max scale is 8000revs/s (in this case 8000mm/s)
# * 8 pole: Max scale is 6000revs/s
drive:
  # just a guess
  numerator: 1000  # mm/s, Max speed is 8000 rev/sec for drive with 6 pole motor
  denominator: 32768
  type: 0                            # Stepper: 0, DS402: 1 (servos)
  control: ec0.s$(DRV_ID).driveControl${DRV_CH=01}
  status: ec0.s$(DRV_ID).driveStatus${DRV_CH=01}
  setpoint: ec0.s$(DRV_ID).velocitySetpoint${DRV_CH=01}
  lookuptable:
    filename: ./cfg/drive_output_offset_el7342.lut
    scale: 1.0
    enable: true

# The encoder on most motors is 20-bit single-turn and 12-bit multi-turn (4096 turns)
encoder:
  type: 0
  position: ec0.s$(ENC_ID).positionActual${ENC_CH=01}
  numerator: 1
  denominator: 10000 # 20bits
  bits: 32

controller:
  Kp: 15.0
  Ki: 0.02
  Kd: 0.0
  inner:
    Ki: 0.04
    Kp: 20
    tol: 0.04
  deadband:
    tol: 0.0
  resetIAtRmp: true


trajectory:
  source: 0
  type: 1
  axis:
    velocity: 400
    acceleration: 1000000
    deceleration: 1000000
    jerk: 100000000

input:
  limit:
    forward: ec0.s$(DRV_ID).ONE.1
    backward: ec0.s$(DRV_ID).ONE.0
  home: ec0.s$(DRV_ID).ONE.0
  interlock: ec0.s$(DRV_ID).ONE.0

softlimits:
  enable: yes
  backwardEnable: yes
  forwardEnable: yes
  forward: 7.5
  backward: 0.0

monitoring:
  lag:
    enable: yes
    tolerance: 0.5
    time: 100
  target:
    enable: yes
    tolerance: 0.01
    time: 100
  velocity:
    enable: yes
    max: 50
    time:
      trajectory: 100
      drive: 200
 
