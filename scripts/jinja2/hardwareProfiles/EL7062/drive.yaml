# EL7062 in CSV mode, channels 1 and 2. The channel chooses the PDO suffix.
# Default scale denominator below is illustrative; verify on real hardware.
channels: 2
drive:
  type: 1
  denominator: 32768
  control: ec$(MASTER).s$(SLAVE).driveControl$(CHANNEL)
  status: ec$(MASTER).s$(SLAVE).driveStatus$(CHANNEL)
  setpoint: ec$(MASTER).s$(SLAVE).velocitySetpoint$(CHANNEL)
