# EL7062: encoder feedback is independent of the motor channel.
# openloop uses the internal step counter; incremental uses the PDO with _2 suffix.
channels: 2
encoder:
  type: 0
  source: 0
  bits: 32
  # Illustrative count scaling; verify against motor and encoder configuration.
  denominator: 12800
feedbacks:
  openloop:
    position: ec$(MASTER).s$(SLAVE).positionActual$(CHANNEL)
  incremental:
    position: ec$(MASTER).s$(SLAVE).positionActual$(CHANNEL)_2
