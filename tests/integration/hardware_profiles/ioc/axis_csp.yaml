# Dedicated SIM fixture: CSP drive selected from HW_DESC, not component type.
axis:
  id: $(AX_ID)
  type: 1
  mode: CSP
epics:
  name: $(AX_NAME)
  unit: mm
  motorRecord:
    enable: false
drive:
  slave: $(DRV_SLAVE)
  numerator: 1.0
  denominator: 1048576
encoder:
  slave: $(ENC_SLAVE)
  numerator: 1.0
  denominator: 1048576
  useAsCSPDrvEnc: true
controller:
  Kp: 0.0
trajectory:
  axis:
    velocity: 0.1
    acceleration: 0.5
    deceleration: 0.5
input:
  limit:
    # SIM-only placeholders. NO physical end-stop protection.
    forward: ec0.s-1.ONE.0
    backward: ec0.s-1.ONE.0
